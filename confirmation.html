<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your order has been confirmed">
    <title>Order Confirmed - Apple Resale Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo" aria-label="Apple Resale Pro Home">Apple Resale Pro</a>
        </div>
    </header>
    
    <main>
        <section class="section confirmation-container">
            <div class="container">
                <h1>Thank You For Your Order!</h1>
                <p>Your order has been placed successfully.</p>
                <p>Your order number is: <strong id="order-number">#12345</strong></p>
                <p style="color: var(--mid-gray); max-width: 600px; margin: 2rem auto;">
                    We'll send you a confirmation email shortly with your order details and tracking information.
                </p>
                <div style="margin-top: 3rem;">
                    <a href="products.html" class="btn"><span>Continue Shopping</span></a>
                </div>
            </div>
        </section>
    </main>
    
    <script src="js/script.js"></script>
</body>
</html>
