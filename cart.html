<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review items in your shopping cart">
    <title>Shopping Cart - Apple Resale Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo" aria-label="Apple Resale Pro Home">Apple Resale Pro</a>
            <nav class="main-nav" aria-label="Main Navigation">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="products.html" class="nav-link">Products</a></li>
                    <li><a href="pre-order.html" class="nav-link">Pre-Order</a></li>
                    <li>
                        <a href="cart.html" class="nav-link cart-icon" aria-current="page" aria-label="Shopping Cart">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                            </svg>
                            Cart 
                            <span class="cart-badge" aria-label="Items in cart">0</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="search-container">
                <input type="search" id="search-bar" placeholder="Search products..." aria-label="Search products">
                <div id="search-results-dropdown" class="search-results-dropdown" role="listbox"></div>
            </div>

            <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <section class="section cart-container">
            <div class="container">
                <h1 class="section-title">Your Shopping Cart</h1>
                <div id="cart-items" role="list">
                    <!-- Cart items will be dynamically loaded here -->
                </div>
                <div class="cart-summary">
                    <h2>Total: $<span id="cart-total">0.00</span></h2>
                    <a href="checkout.html" id="checkout-btn" class="btn"><span>Proceed to Checkout</span></a>
                </div>

                <div class="saved-for-later-container">
                    <h2 class="section-title">Saved For Later</h2>
                    <div id="saved-items-grid" class="saved-items-grid">
                        <!-- Saved items will be dynamically loaded here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <aside id="mini-cart" class="mini-cart" aria-label="Shopping cart">
        <div class="mini-cart-header">
            <h3>Your Cart</h3>
            <button id="close-mini-cart" class="close-btn" aria-label="Close cart">&times;</button>
        </div>
        <div id="mini-cart-items" class="mini-cart-items">
            <!-- Cart items will be dynamically loaded here -->
        </div>
        <div class="mini-cart-footer">
            <div class="mini-cart-subtotal">
                <span>Subtotal:</span>
                <span id="mini-cart-total">$0.00</span>
            </div>
            <a href="cart.html" class="btn"><span>View Cart & Checkout</span></a>
        </div>
    </aside>
    <div id="mini-cart-overlay" class="mini-cart-overlay" aria-hidden="true"></div>

    <footer class="footer">
        <div class="container">
            <nav class="footer-links" aria-label="Footer Navigation">
                <a href="#about">About Us</a>
                <a href="#contact">Contact</a>
                <a href="#terms">Terms of Service</a>
            </nav>
            <p>&copy; 2025 Apple Resale Pro. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
